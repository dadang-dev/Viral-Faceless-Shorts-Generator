services:
  pauseflow:
    build: .
    environment:
      FFMPEG_PATH: ffmpeg
    volumes:
      - ./output:/app/output
      - ./assets:/app/assets:ro
      - ./money-habits-ALL-v4.md:/app/money-habits-ALL-v4.md:ro
      - ./config.yaml:/app/config.yaml:ro
    command: python main.py status --days all
